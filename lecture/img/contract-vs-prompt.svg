<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 444" width="1200" height="444" font-family="Segoe UI,system-ui,sans-serif">
  <defs>
    <marker id="cp-ar" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#8a8a8a"/>
    </marker>
    <marker id="cp-ar-fail" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#c62d3f"/>
    </marker>
  </defs>

  <rect width="1200" height="444" fill="#ffffff" rx="8"/>

  <!-- arrows first, so boxes paint over the line ends -->
  <line x1="300" y1="136" x2="300" y2="172" stroke="#6c757d" stroke-width="1.6" marker-end="url(#cp-ar)"/>
  <line x1="300" y1="240" x2="300" y2="276" stroke="#6c757d" stroke-width="1.6" marker-end="url(#cp-ar)"/>
  <line x1="300" y1="344" x2="300" y2="386" stroke="#6c757d" stroke-width="1.6" stroke-dasharray="4 6" stroke-opacity="0.55"/>

  <line x1="840" y1="136" x2="840" y2="172" stroke="#6c757d" stroke-width="1.6" marker-end="url(#cp-ar)"/>
  <line x1="840" y1="240" x2="840" y2="276" stroke="#6c757d" stroke-width="1.6" marker-end="url(#cp-ar)"/>
  <line x1="840" y1="344" x2="840" y2="388" stroke="#6c757d" stroke-width="1.6" marker-end="url(#cp-ar)"/>
  <path d="M 1060 312 L 1100 312 Q 1108 312 1108 304 L 1108 216 Q 1108 208 1100 208 L 1064 208"
        fill="none" stroke="#c62d3f" stroke-width="1.6" marker-end="url(#cp-ar-fail)"/>

  <text x="856" y="374" fill="#7ee2a8" font-size="16">pass → done</text>
  <rect x="1064" y="238" width="88" height="44" fill="#ffffff"/>
  <text x="1108" y="256" fill="#c62d3f" font-size="16" text-anchor="middle">fail</text>
  <text x="1108" y="276" fill="#c62d3f" font-size="16" text-anchor="middle">→ back</text>

  <text x="300" y="46" fill="#495057" font-size="15" letter-spacing="1.5" text-anchor="middle">ASK</text>
  <text x="840" y="46" fill="#495057" font-size="15" letter-spacing="1.5" text-anchor="middle">CONTRACT</text>

  <!-- asking lane -->
  <rect x="80" y="72" width="440" height="64" rx="6" fill="#e8eff6" stroke="#6c757d"/>
  <text x="300" y="114" fill="#212529" font-size="25" font-weight="600" text-anchor="middle">Prompt</text>

  <rect x="80" y="176" width="440" height="64" rx="6" fill="#e8eff6" stroke="#6c757d"/>
  <text x="300" y="218" fill="#212529" font-size="25" font-weight="600" text-anchor="middle">Answer</text>

  <rect x="80" y="280" width="440" height="64" rx="6" fill="#e8eff6" stroke="#6c757d"/>
  <text x="300" y="310" fill="#212529" font-size="25" font-weight="600" text-anchor="middle">You judge</text>
  <text x="300" y="333" fill="#6c757d" font-size="17" text-anchor="middle">by impression</text>

  <text x="300" y="410" fill="#6c757d" font-size="16" text-anchor="middle">nothing to re-run</text>
  <text x="300" y="432" fill="#6c757d" font-size="16" text-anchor="middle">nothing checked</text>

  <!-- contracting lane -->
  <rect x="620" y="72" width="440" height="64" rx="6" fill="#e8eff6" stroke="#165A97" stroke-width="2"/>
  <text x="840" y="114" fill="#212529" font-size="25" font-weight="600" text-anchor="middle">Rules</text>

  <rect x="620" y="176" width="440" height="64" rx="6" fill="#e8eff6" stroke="#165A97" stroke-width="2"/>
  <text x="840" y="218" fill="#212529" font-size="25" font-weight="600" text-anchor="middle">Agent works</text>

  <rect x="620" y="280" width="440" height="64" rx="6" fill="#e8eff6" stroke="#165A97" stroke-width="2"/>
  <text x="840" y="310" fill="#212529" font-size="25" font-weight="600" text-anchor="middle">Verification</text>
  <text x="840" y="333" fill="#6c757d" font-size="17" text-anchor="middle">acceptance criteria</text>

  <text x="840" y="410" fill="#6c757d" font-size="16" text-anchor="middle">re-runnable, auditable</text>
  <text x="840" y="432" fill="#165A97" font-size="16" font-weight="600" text-anchor="middle">deliverable, not draft</text>
</svg>
