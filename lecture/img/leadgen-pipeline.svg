<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" font-family="Segoe UI,system-ui,sans-serif">
  <defs>
    <marker id="lg-ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#6c757d"/></marker>
  </defs>

  <!-- title row -->
  <text x="600" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#495057" letter-spacing="2">LEAD-GENERATION LOOP</text>
  <text x="600" y="58" text-anchor="middle" font-size="14" fill="#6c757d">agent executes steps 2–5 · the human owns steps 1 and 6</text>

  <!-- six boxes in a row -->
  <g font-size="17" font-weight="700">
    <!-- 1 DEFINE (human) -->
    <rect x="40" y="120" width="170" height="118" rx="10" fill="#f4f7fa" stroke="#165A97" stroke-width="2"/>
    <circle cx="90" cy="148" r="13" fill="#165A97"/><text x="90" y="153" text-anchor="middle" font-size="14" fill="#fff">1</text>
    <text x="125" y="154" fill="#212529" font-size="17">DEFINE</text>
    <text x="125" y="186" text-anchor="middle" font-size="13" font-weight="400" fill="#495057">ICP + criteria</text>
    <text x="125" y="206" text-anchor="middle" font-size="13" font-weight="400" fill="#6c757d">(human)</text>

    <!-- 2 SOURCE -->
    <rect x="230" y="120" width="170" height="118" rx="10" fill="#f4f7fa" stroke="#adb5bd"/>
    <circle cx="280" cy="148" r="13" fill="#6c757d"/><text x="280" y="153" text-anchor="middle" font-size="14" fill="#fff">2</text>
    <text x="315" y="154" fill="#212529" font-size="17">SOURCE</text>
    <text x="315" y="186" text-anchor="middle" font-size="13" font-weight="400" fill="#495057">browser + search</text>
    <text x="315" y="206" text-anchor="middle" font-size="13" font-weight="400" fill="#6c757d">pages, events, news</text>

    <!-- 3 QUALIFY -->
    <rect x="420" y="120" width="170" height="118" rx="10" fill="#f4f7fa" stroke="#adb5bd"/>
    <circle cx="470" cy="148" r="13" fill="#6c757d"/><text x="470" y="153" text-anchor="middle" font-size="14" fill="#fff">3</text>
    <text x="505" y="154" fill="#212529" font-size="17">QUALIFY</text>
    <text x="505" y="186" text-anchor="middle" font-size="13" font-weight="400" fill="#495057">score vs criteria</text>
    <text x="505" y="206" text-anchor="middle" font-size="13" font-weight="400" fill="#6c757d">fit signals, evidence</text>

    <!-- 4 RECORD -->
    <rect x="610" y="120" width="170" height="118" rx="10" fill="#f4f7fa" stroke="#adb5bd"/>
    <circle cx="660" cy="148" r="13" fill="#6c757d"/><text x="660" y="153" text-anchor="middle" font-size="14" fill="#fff">4</text>
    <text x="695" y="154" fill="#212529" font-size="17">RECORD</text>
    <text x="695" y="186" text-anchor="middle" font-size="13" font-weight="400" fill="#495057">claims + URLs</text>
    <text x="695" y="206" text-anchor="middle" font-size="13" font-weight="400" fill="#6c757d">saved as data</text>

    <!-- 5 VERIFY -->
    <rect x="800" y="120" width="170" height="118" rx="10" fill="#f4f7fa" stroke="#adb5bd"/>
    <circle cx="850" cy="148" r="13" fill="#6c757d"/><text x="850" y="153" text-anchor="middle" font-size="14" fill="#fff">5</text>
    <text x="885" y="154" fill="#212529" font-size="17">VERIFY</text>
    <text x="885" y="186" text-anchor="middle" font-size="13" font-weight="400" fill="#495057">citations resolve</text>
    <text x="885" y="206" text-anchor="middle" font-size="13" font-weight="400" fill="#6c757d">no invented facts</text>

    <!-- 6 OUTPUT (human) -->
    <rect x="990" y="120" width="170" height="118" rx="10" fill="#f4f7fa" stroke="#3d8f45" stroke-width="2"/>
    <circle cx="1040" cy="148" r="13" fill="#3d8f45"/><text x="1040" y="153" text-anchor="middle" font-size="14" fill="#fff">6</text>
    <text x="1075" y="154" fill="#212529" font-size="17">OUTPUT</text>
    <text x="1075" y="186" text-anchor="middle" font-size="13" font-weight="400" fill="#495057">ranked shortlist</text>
    <text x="1075" y="206" text-anchor="middle" font-size="13" font-weight="400" fill="#6c757d">(human)</text>
  </g>

  <!-- arrows between boxes -->
  <line x1="213" y1="179" x2="227" y2="179" stroke="#6c757d" stroke-width="2" marker-end="url(#lg-ar)"/>
  <line x1="403" y1="179" x2="417" y2="179" stroke="#6c757d" stroke-width="2" marker-end="url(#lg-ar)"/>
  <line x1="593" y1="179" x2="607" y2="179" stroke="#6c757d" stroke-width="2" marker-end="url(#lg-ar)"/>
  <line x1="783" y1="179" x2="797" y2="179" stroke="#6c757d" stroke-width="2" marker-end="url(#lg-ar)"/>
  <line x1="973" y1="179" x2="987" y2="179" stroke="#6c757d" stroke-width="2" marker-end="url(#lg-ar)"/>

  <!-- feedback loop -->
  <path d="M 1075 238 L 1075 300 L 125 300 L 125 242" fill="none" stroke="#c47f0e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#lg-ar)"/>
  <text x="600" y="320" text-anchor="middle" font-size="14" fill="#c47f0e">learnings update the contract before the next run — the loop tightens</text>
</svg>
