<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" font-family="Segoe UI,system-ui,sans-serif">
  <defs>
    <marker id="mhl-ar" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#6c757d"/></marker>
  </defs>

  <!-- column 1: Model -->
  <rect x="20" y="40" width="350" height="240" rx="12" fill="#f4f7fa" stroke="#ced4da"/>
  <text x="195" y="72" text-anchor="middle" font-size="21" font-weight="700" fill="#165A97">Model</text>
  <text x="195" y="96" text-anchor="middle" font-size="15" fill="#6c757d">the reasoning engine</text>
  <circle cx="195" cy="160" r="42" fill="#e8eff6" stroke="#adb5bd" stroke-width="2"/>
  <path d="M 171 162 C 165 152 169 140 181 138 C 185 128 201 126 207 132 C 219 128 229 138 227 148 C 235 156 231 168 221 172 C 219 180 207 182 201 178 C 191 184 177 180 175 172 C 169 170 169 166 171 162 Z"
        fill="none" stroke="#212529" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M 187 150 C 193 144 201 146 203 152" fill="none" stroke="#212529" stroke-width="1.8" opacity="0.7"/>
  <path d="M 191 164 C 199 158 207 162 209 168" fill="none" stroke="#212529" stroke-width="1.8" opacity="0.7"/>
  <text x="195" y="228" text-anchor="middle" font-size="16" fill="#212529">the brain</text>
  <text x="195" y="252" text-anchor="middle" font-size="14" fill="#6c757d">thinks, reasons, decides</text>

  <!-- arrow 1 -->
  <line x1="374" y1="160" x2="421" y2="160" stroke="#6c757d" stroke-width="2" marker-end="url(#mhl-ar)"/>

  <!-- column 2: Harness -->
  <rect x="425" y="40" width="350" height="240" rx="12" fill="#f4f7fa" stroke="#ced4da"/>
  <text x="600" y="72" text-anchor="middle" font-size="21" font-weight="700" fill="#165A97">Harness</text>
  <text x="600" y="96" text-anchor="middle" font-size="15" fill="#6c757d">tools + rules + memory</text>
  <rect x="485" y="118" width="230" height="52" rx="8" fill="#e8eff6" stroke="#adb5bd" stroke-width="2"/>
  <text x="600" y="143" text-anchor="middle" font-size="18" fill="#212529">files · git · browser</text>
  <text x="600" y="163" text-anchor="middle" font-size="14" fill="#6c757d">(pi, OpenCode, MCP tools)</text>
  <rect x="485" y="196" width="230" height="52" rx="8" fill="#e8eff6" stroke="#adb5bd" stroke-width="2"/>
  <text x="600" y="221" text-anchor="middle" font-size="18" fill="#212529">contract · memory</text>
  <text x="600" y="241" text-anchor="middle" font-size="14" fill="#6c757d">(rules, notes, history)</text>

  <!-- arrow 2 -->
  <line x1="779" y1="160" x2="826" y2="160" stroke="#6c757d" stroke-width="2" marker-end="url(#mhl-ar)"/>

  <!-- column 3: Loop -->
  <rect x="830" y="40" width="350" height="240" rx="12" fill="#f4f7fa" stroke="#ced4da"/>
  <text x="1005" y="72" text-anchor="middle" font-size="21" font-weight="700" fill="#165A97">Loop</text>
  <text x="1005" y="96" text-anchor="middle" font-size="15" fill="#6c757d">the work day</text>

  <rect x="866" y="116" width="110" height="46" rx="8" fill="#e8eff6" stroke="#c47f0e"/><text x="921" y="145" text-anchor="middle" font-size="16" fill="#212529">Plan</text>
  <rect x="1034" y="116" width="110" height="46" rx="8" fill="#e8eff6" stroke="#c47f0e"/><text x="1089" y="145" text-anchor="middle" font-size="16" fill="#212529">Act</text>
  <rect x="866" y="196" width="110" height="46" rx="8" fill="#e8eff6" stroke="#c47f0e"/><text x="921" y="225" text-anchor="middle" font-size="15" fill="#212529">Check</text>
  <rect x="1034" y="196" width="110" height="46" rx="8" fill="#e8eff6" stroke="#c47f0e"/><text x="1089" y="225" text-anchor="middle" font-size="15" fill="#212529">Correct</text>

  <line x1="980" y1="139" x2="1030" y2="139" stroke="#6c757d" stroke-width="2" marker-end="url(#mhl-ar)"/>
  <line x1="1089" y1="166" x2="1089" y2="192" stroke="#6c757d" stroke-width="2" marker-end="url(#mhl-ar)"/>
  <line x1="980" y1="219" x2="1030" y2="219" stroke="#6c757d" stroke-width="2" marker-end="url(#mhl-ar)"/>
  <path d="M 866 219 L 852 219 L 852 139 L 862 139" fill="none" stroke="#6c757d" stroke-width="2" marker-end="url(#mhl-ar)"/>
  <text x="1005" y="272" text-anchor="middle" font-size="14" fill="#6c757d">repeat until verified</text>
